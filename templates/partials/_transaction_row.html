<tr class="border-b border-slate-800/80 hover:bg-slate-800/30 transition-colors">
    <td class="py-3.5 px-4 text-sm text-slate-400 whitespace-nowrap">
        {{ txn.date|date:"Y-m-d" }}
    </td>
    <td class="py-3.5 px-4">
        <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-slate-100">{{ txn.merchant|default:"Unknown Merchant" }}</span>
            <button hx-post="{% url 'transactions:toggle_recurring' txn.id %}"
                    hx-target="closest tr"
                    hx-swap="outerHTML"
                    title="Click to toggle recurring status"
                    class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium transition-colors {% if txn.is_recurring %}bg-indigo-500/20 text-indigo-300 border border-indigo-500/30{% else %}bg-slate-800/60 text-slate-500 hover:text-slate-300 border border-slate-700/40{% endif %}">
                {% csrf_token %}
                <svg class="w-2.5 h-2.5 mr-1 {% if txn.is_recurring %}text-indigo-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                {% if txn.is_recurring %}Recurring{% else %}One-off{% endif %}
            </button>
        </div>
        {% if txn.description %}
            <div class="text-xs text-slate-400 mt-0.5">{{ txn.description }}</div>
        {% endif %}
    </td>
    <td class="py-3.5 px-4 whitespace-nowrap">
        <form hx-post="{% url 'transactions:recategorize' txn.id %}"
              hx-target="closest tr"
              hx-swap="outerHTML"
              class="inline-block m-0">
            {% csrf_token %}
            <select name="category"
                    hx-trigger="change"
                    class="text-xs font-medium rounded-lg bg-slate-800/90 border border-slate-700/80 text-emerald-400 hover:border-emerald-500/50 focus:outline-none focus:ring-1 focus:ring-emerald-500 py-1 px-2.5 transition-colors cursor-pointer">
                {% if not txn.category %}
                    <option value="" selected disabled>Uncategorized</option>
                {% endif %}
                {% for cat in categories|default:request.user.category_set.all %}
                    <option value="{{ cat.id }}" {% if txn.category_id == cat.id %}selected{% endif %}>
                        {{ cat.name }}
                    </option>
                {% endfor %}
            </select>
        </form>
    </td>
    <td class="py-3.5 px-4 text-sm text-slate-400 whitespace-nowrap">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700/60">
            {{ txn.account.name }}
        </span>
    </td>
    <td class="py-3.5 px-4 text-sm font-semibold text-right whitespace-nowrap {% if txn.kind == 'INCOME' %}text-emerald-400{% else %}text-rose-400{% endif %}">
        {% if txn.kind == 'INCOME' %}+₹{{ txn.amount|floatformat:2 }}{% else %}-₹{{ txn.amount|floatformat:2 }}{% endif %}
    </td>
</tr>
<div id="form-errors" hx-swap-oob="true"></div>
