services:
  postgres:
    image: postgres:16
    container_name: paylio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spendtracker
      POSTGRES_USER: spendtracker
      POSTGRES_PASSWORD: change-me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: paylio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: